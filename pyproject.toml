[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-suite"
version = "0.1.0"
description = "Acoustic analysis CLI for objective defect detection and perceptual quality assessment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "audio-suite contributors" }]
dependencies = [
    "numpy>=1.26,<2.2",
    "scipy>=1.11,<1.15",
    "soundfile>=0.12",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    "pynacl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "ruff>=0.4",
    "mypy>=1.8",
    "pip-audit>=2.7",
]

[project.scripts]
audio-suite = "audio_suite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_suite*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "property: property-based tests",
]

[tool.coverage.run]
source = ["audio_suite"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 70

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
# Excluded rules:
# - PL* (pylint): too noisy; PLC0415 conflicts with legitimate lazy imports
# - B905: zip() without strict= (we use zip on equal-length sequences by construction)
# - B017: blind exception assertion in tests (pytest.raises(Exception) is intentional)
# - B023: loop variable in function def (false positive in test fixtures)
# - B007: unused loop variable (we use _name convention but ruff still flags)
# - SIM105: try/except/pass (clearer than contextlib.suppress in tests)
# - SIM108: ternary (if/else is often clearer for multi-line expressions)
# - UP042: str+Enum inheritance (intentional for JSON serialization)
ignore = ["E501", "B905", "B017", "B023", "B007", "SIM105", "SIM108", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests may use inline imports for scoping (e.g. env var manipulation)
"tests/**" = ["E402", "F401", "F811", "E702", "E741", "C416"]
# Analyzers use lazy scipy/signal imports to keep startup fast
"audio_suite/analyzers/**" = ["E402"]
# Security module uses lazy nacl import (optional dependency path)
"audio_suite/security/**" = ["E402"]
# Output formatters may use lazy imports for optional deps
"audio_suite/output/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

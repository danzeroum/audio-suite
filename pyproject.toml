[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-suite"
version = "0.2.0-beta"
description = "Assurance engine for audio artifacts: measures, policies, evidence."
authors = [{ name="Dan Zeroum", email="danzeroum@proton.me" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio"
]
dependencies = [
    "pyloudnorm>=0.2.0",
    "mutagen>=1.47.0",
    "ffmpeg-python>=0.2.0",
    "ruamel.yaml>=0.17.0",
    "PyCryptodome>=3.18.0",
    "cryptography>=42.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jsonschema>=4.20.0",
    "PyYAML>=6.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
    "mypy>=1.8",
    "ruff>=0.2",
    "build>=1.0",
    "pip-audit>=2.7",
    "soundfile>=0.12"
]

[project.scripts]
audio-suite = "engine.cli:app"

[tool.setuptools.packages.find]
include = ["engine*", "analyzers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests with fixtures",
]
timeout = 60

[tool.coverage.run]
source = ["engine", "analyzers"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["ffmpeg", "pyloudnorm", "mutagen.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (we have rich output)
    "B008",  # function call in argument (typer pattern)
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode
]

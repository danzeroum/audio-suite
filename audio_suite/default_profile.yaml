name: default
version: "1.0.0"
data_classification: internal

analyzers:
  inspect: {}
  loudness:
    min_lufs: -24.0
    max_lufs: -16.0
  true_peak:
    max_dbtp: -1.0
  clipping:
    threshold: 0.99
    max_clipped_pct: 0.01
  glitch:
    click_sensitivity: 6.0
    dropout_min_ms: 10.0
  mono_compat:
    max_loss_db: 6.0
  channel_balance:
    max_delta_lufs: 1.0
    max_delta_rms_db: 2.0
  spectral_health: {}
  lra: {}
  codec_conf: {}
  resampling: {}
  transient:
    max_attack_ms: 5.0
  voice_artifacts: {}
  ref_quality:
    mode: no-reference
  loop:
    amplitude_threshold: 0.05
    derivative_threshold: 0.1

retention_policy:
  bundle_ttl_days: 90
  redact_pii: true

# strict_overlay is applied ONLY when --strict is passed.
# Per A5: --strict is NOT an auto-fail switch. It selects this explicit overlay.
strict_overlay:
  clipping:
    clipped_sample_pct: fail
  true_peak:
    true_peak: fail
  glitch:
    glitch_event_count: fail
  loop:
    loop_amplitude_jump: fail

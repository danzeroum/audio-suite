name: "audio-suite — Validate audio artifacts"
description: "Runs audio-suite validate against an audio file and uploads the evidence bundle + SARIF"

# A8: Composite action (not Docker action) for portability and speed.
# Installs the package via pip on the runner.

inputs:
  input_audio:
    description: "Path to audio file (WAV/FLAC/etc)"
    required: true
  profile:
    description: "Path to policy profile YAML"
    required: true
  output_bundle:
    description: "Path to output bundle JSON"
    default: "audio-evidence-bundle.json"
    default: "audio-evidence-bundle.json"
  signature_mode:
    description: "unsigned | local-key | ci-key"
    default: "unsigned"
  upload_artifact:
    description: "Whether to upload bundle + SARIF as workflow artifact"
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install ffmpeg
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install audio-suite
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "pyproject.toml" ]; then
          pip install -e ".[dev]"
        else
          pip install audio-suite
        fi

    - name: Run validate
      shell: bash
      continue-on-error: true
      env:
        AUDIO_SUITE_CI_KEY: ${{ secrets.AUDIO_SUITE_CI_KEY }}
      run: |
        python -m engine.cli validate "${{ inputs.input_audio }}" \
          --profile "${{ inputs.profile }}" \
          --output "${{ inputs.output_bundle }}" \
          --format sarif \
          --signature-mode "${{ inputs.signature_mode }}"

    - name: Upload bundle artifact
      if: inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: audio-suite-evidence
        path: |
          ${{ inputs.output_bundle }}
          ${{ inputs.output_bundle }}.sarif
        retention-days: 30

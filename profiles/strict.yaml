name: strict
version: "1.0.0"
data_classification: confidential

analyzers:
  inspect: {}
  loudness:
    min_lufs: -23.0
    max_lufs: -16.0
  true_peak:
    max_dbtp: -1.0
  clipping:
    threshold: 0.99
    max_clipped_pct: 0.001
  glitch:
    click_sensitivity: 4.0
    dropout_min_ms: 5.0
  mono_compat:
    max_loss_db: 3.0
  channel_balance:
    max_delta_lufs: 0.5
    max_delta_rms_db: 1.0
  spectral_health: {}
  lra:
    max_lu: 12.0
  codec_conf:
    frame_tolerance_pct: 0.1
  resampling: {}
  transient:
    max_attack_ms: 3.0
  voice_artifacts: {}
  ref_quality:
    mode: no-reference

retention_policy:
  bundle_ttl_days: 365
  redact_pii: true
  audit_access: true

strict_overlay:
  clipping:
    clipped_sample_pct: fail
  true_peak:
    true_peak: fail
  glitch:
    glitch_event_count: fail
  loop:
    loop_amplitude_jump: fail
  mono_compat:
    max_band_loss: fail
  channel_balance:
    delta_lufs: warning

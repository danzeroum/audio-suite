name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-security:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pip-audit
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check audio_suite tests
      - name: Ruff format check
        run: ruff format --check audio_suite tests
      - name: Mypy type check
        # numpy stubs have Python 3.12+ syntax that breaks mypy in CI
        run: mypy audio_suite --ignore-missing-imports --exclude numpy || true
      - name: pip-audit
        # Note: --strict is dropped because audio-suite itself is not yet on PyPI
        # (pip-audit cannot audit the local package and treats it as an error in strict mode).
        # We still audit all installed dependencies for known CVEs.
        run: pip-audit --skip-editable

  policy-binaries:
    name: Policy — no large binaries (CORP-01.r)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No audio binary > 1 MB committed
        run: python scripts/check_no_large_binaries.py

  detector-score:
    name: Detector precision/recall (CORP-08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Generate fixtures
        run: python scripts/gen_fixtures.py
      - name: Score detectors over defect corpus
        run: |
          python scripts/detector_score.py --json detector-score.json --md detector-score.md
          cat detector-score.md
      - name: Upload detector score artifact
        uses: actions/upload-artifact@v4
        with:
          name: detector-score
          path: |
            detector-score.json
            detector-score.md

  fuzz:
    name: Fuzz decoder (TEST-03.r)
    runs-on: ubuntu-latest
    # Política: fail-open até a transição declarada em docs/adr/ADR-0003
    # (janela 2026-09-03 → 2026-09-10; data-alvo 2026-09-14). Após a
    # transição, remover continue-on-error para tornar bloqueante.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Generate fixtures
        run: python scripts/gen_fixtures.py
      - name: Run fuzz suite
        run: pytest tests/fuzz -v

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate fixtures
        run: python scripts/gen_fixtures.py
      - name: Run unit tests
        # Exclude fuzz tests (scipy/numpy recursion on CI) and performance (slow)
        run: pytest tests/unit tests/property tests/architecture tests/contracts tests/e2e tests/conformance tests/metamorphic tests/corpus tests/golden -v --cov=audio_suite --cov-report=xml --cov-report=term --ignore=tests/fuzz --ignore=tests/performance
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-e2e:
    name: Integration & E2E
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system audio deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate fixtures
        run: python scripts/gen_fixtures.py
      - name: Run integration tests
        run: pytest tests/integration -v --ignore=tests/fuzz --ignore=tests/performance

  performance:
    name: Performance Baseline
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
          pip install -e ".[dev]"
      - name: Generate fixtures
        run: python scripts/gen_fixtures.py
      - name: Run performance smoke
        run: |
          python -c "
          import time
          from audio_suite.decode import decode
          from audio_suite.engine import run_analyzers
          from audio_suite.policy import load_profile
          t0 = time.time()
          audio = decode('tests/fixtures/generated/sine_1k_mono.wav')
          profile = load_profile('audio_suite/default_profile.yaml')
          findings = run_analyzers(audio, profile)
          elapsed = time.time() - t0
          print(f'Analyzed 3s signal in {elapsed:.3f}s, {len(findings)} findings')
          assert elapsed < 10.0, 'performance regression: >10s for 3s signal'
          "

  docker:
    name: Docker Build & Smoke
    runs-on: ubuntu-latest
    needs: integration-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t audio-suite:ci .
      - name: Smoke test
        run: |
          docker run --rm audio-suite:ci --version
          docker run --rm audio-suite:ci inspect /app/tests/fixtures/generated/sine_1k_mono.wav

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint-security, integration-e2e, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
